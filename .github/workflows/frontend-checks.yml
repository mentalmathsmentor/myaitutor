name: Frontend checks

on:
  pull_request:
    paths:
      - 'mait-mvp/frontend/**'
      - 'mait-mvp/contracts/**'
      - '.github/workflows/frontend-checks.yml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

jobs:
  worksheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mait-mvp/frontend/package-lock.json
      - name: Install dependencies
        working-directory: mait-mvp/frontend
        run: npm ci --no-audit --no-fund
      - name: Test frontend and worksheet acceptance
        working-directory: mait-mvp/frontend
        run: npm test
      - name: Install test browser
        working-directory: mait-mvp/frontend
        run: npx playwright install --with-deps chromium
      - name: Test production-build worksheet flow
        working-directory: mait-mvp/frontend
        run: npm run test:e2e
